# AndroidX & Compose
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
android.compose.compiler.enable=true

# Kotlin Code Style
kotlin.code.style=official

# Оптимизация памяти JVM: увеличение heap для стабильной работы Jetpack Compose компилятора
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Ускорение компиляции Kotlin и Gradle
kotlin.incremental=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.vfs.watch=true