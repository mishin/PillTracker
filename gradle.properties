# AndroidX & Compose
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
android.compose.compiler.enable=true

# Kotlin Code Style
kotlin.code.style=official

# Оптимизация памяти JVM: снижаем аллокацию с 2048m до 1024m для предотвращения ошибки commit_memory (errno 1455)
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Отключение удержания тяжелых неиспользуемых демонов
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000
org.gradle.parallel=false
org.gradle.vfs.watch=false